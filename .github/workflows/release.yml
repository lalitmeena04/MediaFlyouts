name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.0"
        required: true

permissions:
  contents: read

# Releases ship to a separate repo. RELEASE_REPO holds the shipped app files
# and the published GitHub Release. RELEASE_BRANCH is that repo default branch.
env:
  RELEASE_REPO: ${{ github.repository_owner }}/MediaFlyouts-Releases
  RELEASE_BRANCH: main

jobs:
  release:
    name: Build & publish artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Manual runs build the requested tag source. Tag pushes build the
          # pushed tag. This keeps release binaries version-accurate.
          ref: ${{ github.event.inputs.version || github.ref }}

      # Mint a short-lived token for the release repo. The GitHub App must be
      # installed on RELEASE_REPO with Contents read/write. It signs both the
      # git push and the Release API calls.
      - name: Generate release-repo token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: MediaFlyouts-Releases

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a vMAJOR.MINOR.PATCH tag, got '$tag'" }
          $ver = $tag.TrimStart('v')
          $fileVer = (Get-Content VERSION.txt -Raw).Trim()
          if ($ver -ne $fileVer) { throw "Tag $tag does not match the VERSION file ($fileVer)" }
          "tag=$tag"        >> $env:GITHUB_OUTPUT
          "version=$ver"    >> $env:GITHUB_OUTPUT
          "msixver=$ver.0"  >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure & build (release)
        run: |
          cmake --preset msvc-release -D "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -D MEDIAFLYOUTS_ENABLE_LOGGING=OFF
          cmake --build --preset msvc-release

      - name: Test
        run: ctest --preset msvc-release --output-on-failure

      - name: Stage Qt runtime (windeployqt)
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir Views --no-translations "${{ github.workspace }}\bin\MediaFlyouts.exe"

      - name: Prepare dist folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Source ZIP
        run: git archive --format=zip -o "dist/MediaFlyouts-${{ steps.ver.outputs.version }}-src.zip" HEAD

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path bin\* -DestinationPath "dist/MediaFlyouts-${{ steps.ver.outputs.version }}-win64.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\MediaFlyouts.iss

      - name: MSIX package
        # only runs once the logo PNGs exist under packaging/msix/Images/
        if: ${{ hashFiles('packaging/msix/Images/**') != '' }}
        shell: pwsh
        run: |
          $layout = "msix-layout"
          New-Item -ItemType Directory -Force $layout | Out-Null
          Copy-Item bin\* $layout -Recurse -Force
          Copy-Item packaging\msix\Images $layout\Images -Recurse -Force
          # inject the 4-part version into the manifest
          (Get-Content packaging\msix\AppxManifest.xml) `
            -replace 'Version="\d+\.\d+\.\d+\.\d+"', 'Version="${{ steps.ver.outputs.msixver }}"' `
            | Set-Content "$layout\AppxManifest.xml"

          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          $tools = Join-Path $sdk.FullName "x64"
          $msix = "dist/MediaFlyouts-${{ steps.ver.outputs.version }}.msix"
          & "$tools\makeappx.exe" pack /o /d $layout /p $msix

          # Prefer a stored certificate so every release is signed with the same
          # one (users trust MediaFlyouts.cer once). Fall back to a self-signed
          # certificate generated on the runner when no secret is configured.
          if ("${{ secrets.MSIX_CERT_BASE64 }}" -ne "") {
            $pfx = Join-Path $env:RUNNER_TEMP 'MediaFlyouts.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.MSIX_CERT_BASE64 }}"))
            $password = ConvertTo-SecureString "${{ secrets.MSIX_CERT_PASSWORD }}" -AsPlainText -Force
            $certificate = (Get-PfxData -FilePath $pfx -Password $password).EndEntityCertificates | Select-Object -First 1
            if (-not $certificate -or $certificate.Subject -ne 'CN=MediaFlyouts') {
              throw "MSIX signing certificate subject must be CN=MediaFlyouts, got '$($certificate.Subject)'."
            }
            Export-Certificate -Cert $certificate -FilePath dist\MediaFlyouts.cer | Out-Null
            & "$tools\signtool.exe" sign /fd SHA256 /a /f $pfx /p "${{ secrets.MSIX_CERT_PASSWORD }}" $msix
            if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign the MSIX." }
            Remove-Item $pfx -Force
          } else {
            Write-Warning "No MSIX_CERT_BASE64 secret set; generating a throwaway self-signed certificate. Store a certificate as a secret to reuse the same one across releases."
            & tools\new-signing-cert.ps1 -Msix $msix
            if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign the MSIX." }
            Copy-Item signing\MediaFlyouts.cer dist\MediaFlyouts.cer -Force
          }

          & "$tools\signtool.exe" verify /pa /all $msix
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "MSIX signature is valid but is not trusted by the GitHub runner; users must trust MediaFlyouts.cer for a self-signed certificate."
            # SignTool returns 1 when a self-signed root is not trusted. The
            # sign command above already validated that the package was signed.
            $global:LASTEXITCODE = 0
          }

      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content docs/RELEASE_NOTES.md -Encoding utf8
          # take the "## Version <ver> ..." heading and everything up to the next "## " heading
          $start = ($lines | Select-String -Pattern "^##\s+Version\s+$([regex]::Escape($ver))\b" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "No '## Version $ver' section found in docs/RELEASE_NOTES.md" }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^##\s' | Select-Object -First 1).LineNumber
          $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          ($body -join "`n").Trim() | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Sync app files to release repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ env.RELEASE_REPO }}"
          $branch = "${{ env.RELEASE_BRANCH }}"
          $token = "${{ steps.app-token.outputs.token }}"
          $work = Join-Path $env:RUNNER_TEMP 'release-repo'

          # Clone the release repo. The token goes in the URL so git can push.
          git clone "https://x-access-token:$token@github.com/$repo.git" $work
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone $repo." }
          Push-Location $work

          # Wipe the old tree but keep git metadata. Each release is a clean
          # snapshot of the shipped app files plus the docs.
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item "${{ github.workspace }}\bin\*" . -Recurse -Force
          Copy-Item "${{ github.workspace }}\README.md" README.md -Force
          Copy-Item "${{ github.workspace }}\docs\RELEASE_NOTES.md" RELEASE_NOTES.md -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git status --porcelain) {
            git commit -m "Release $tag"
          } else {
            Write-Host "No file changes to commit."
          }
          # Force the tag so a re-run points at the fresh commit.
          git tag -f $tag
          git push origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) { throw "Failed to push to $repo." }
          git push -f origin $tag
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tag $tag." }
          Pop-Location

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ env.RELEASE_REPO }}"
          $assets = Get-ChildItem dist | ForEach-Object FullName

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repo --clobber
            gh release edit $tag --repo $repo --notes-file release-notes.md
          } else {
            gh release create $tag $assets `
              --repo $repo `
              --title "MediaFlyouts $tag" `
              --notes-file release-notes.md `
              --verify-tag
          }
