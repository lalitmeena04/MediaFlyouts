name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.2.0"
        required: true

# contents: write lets GITHUB_TOKEN publish the mirror Release in this repo.
permissions:
  contents: write

# Releases ship to a separate repo. RELEASE_REPO holds the shipped app files
# and the published GitHub Release. RELEASE_BRANCH is that repo default branch.
# The same Release is mirrored to this repo so both carry the same artifacts.
env:
  RELEASE_REPO: ${{ github.repository_owner }}/MediaFlyouts-Releases
  RELEASE_BRANCH: main

jobs:
  release:
    name: Build & publish artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Manual runs build the requested tag source. Tag pushes build the
          # pushed tag. This keeps release binaries version-accurate.
          ref: ${{ github.event.inputs.version || github.ref }}

      # Mint a short-lived token for the release repo. The GitHub App must be
      # installed on RELEASE_REPO with Contents read/write. It signs both the
      # git push and the Release API calls.
      - name: Generate release-repo token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: MediaFlyouts-Releases

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Expected a vMAJOR.MINOR.PATCH tag, got '$tag'" }
          $ver = $tag.TrimStart('v')
          $fileVer = (Get-Content VERSION.txt -Raw).Trim()
          if ($ver -ne $fileVer) { throw "Tag $tag does not match the VERSION file ($fileVer)" }
          "tag=$tag"        >> $env:GITHUB_OUTPUT
          "version=$ver"    >> $env:GITHUB_OUTPUT
          "msixver=$ver.0"  >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.8.*"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure & build (release)
        run: |
          cmake --preset msvc-release -D "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          cmake --build --preset msvc-release

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset msvc-release --output-on-failure

      - name: Stage Qt runtime (windeployqt)
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir Views --no-translations "${{ github.workspace }}\bin\MediaFlyouts.exe"

      - name: Prepare dist folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Source ZIP
        run: git archive --format=zip -o "dist/MediaFlyouts-${{ steps.ver.outputs.version }}-src.zip" HEAD

      - name: Portable ZIP
        shell: pwsh
        run: Compress-Archive -Path bin\* -DestinationPath "dist/MediaFlyouts-${{ steps.ver.outputs.version }}-win64.zip"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\MediaFlyouts.iss

      # The Store signs the package with Microsoft's certificate, so the MSIX is
      # built unsigned with the identity Partner Center reserved. It ships on
      # the GitHub release as the exact file that is uploaded to Partner Center;
      # it cannot be installed directly, users get the signed copy from the Store.
      - name: Store MSIX (unsigned)
        if: ${{ hashFiles('packaging/msix/Images/**') != '' && vars.STORE_IDENTITY_NAME != '' && vars.STORE_IDENTITY_PUBLISHER != '' }}
        shell: pwsh
        run: |
          & tools\stage-msix.ps1 `
            -Version "${{ steps.ver.outputs.msixver }}" `
            -Output "dist\MediaFlyouts-${{ steps.ver.outputs.version }}.msix" `
            -IdentityName "${{ vars.STORE_IDENTITY_NAME }}" `
            -IdentityPublisher "${{ vars.STORE_IDENTITY_PUBLISHER }}" `
            -Layout msix-layout

      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $lines = Get-Content docs/RELEASE_NOTES.md -Encoding utf8
          # take the "## Version <ver> ..." heading and everything up to the next "## " heading
          $start = ($lines | Select-String -Pattern "^##\s+Version\s+$([regex]::Escape($ver))\b" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "No '## Version $ver' section found in docs/RELEASE_NOTES.md" }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^##\s' | Select-Object -First 1).LineNumber
          $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          ($body -join "`n").Trim() | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Sync app files to release repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ env.RELEASE_REPO }}"
          $branch = "${{ env.RELEASE_BRANCH }}"
          $token = "${{ steps.app-token.outputs.token }}"
          $work = Join-Path $env:RUNNER_TEMP 'release-repo'

          # Clone the release repo. The token goes in the URL so git can push.
          git clone "https://x-access-token:$token@github.com/$repo.git" $work
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone $repo." }
          Push-Location $work

          # Wipe the old tree but keep git metadata and the release repo's own
          # workflows/scripts. Each release is a clean snapshot of the shipped
          # app files plus the docs.
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git', '.github') } | Remove-Item -Recurse -Force
          Copy-Item "${{ github.workspace }}\bin\*" . -Recurse -Force
          Copy-Item "${{ github.workspace }}\README.md" README.md -Force
          # docs/ powers the README navigation links, so ship the whole tree.
          Copy-Item "${{ github.workspace }}\docs" docs -Recurse -Force
          # Extra files the README links to. Copy when present so older tags
          # that lack them still build.
          if (Test-Path "${{ github.workspace }}\CHANGELOG.md") {
            Copy-Item "${{ github.workspace }}\CHANGELOG.md" CHANGELOG.md -Force
          }
          if (Test-Path "${{ github.workspace }}\packaging\README.md") {
            New-Item -ItemType Directory -Force packaging | Out-Null
            Copy-Item "${{ github.workspace }}\packaging\README.md" packaging\README.md -Force
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git status --porcelain) {
            git commit -m "Release $tag"
          } else {
            Write-Host "No file changes to commit."
          }
          # Force the tag so a re-run points at the fresh commit.
          git tag -f $tag
          git push origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) { throw "Failed to push to $repo." }
          git push -f origin $tag
          if ($LASTEXITCODE -ne 0) { throw "Failed to push tag $tag." }
          Pop-Location

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ env.RELEASE_REPO }}"
          $assets = Get-ChildItem dist | ForEach-Object FullName

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repo --clobber
            gh release edit $tag --repo $repo --notes-file release-notes.md
          } else {
            gh release create $tag $assets `
              --repo $repo `
              --title "MediaFlyouts $tag" `
              --notes-file release-notes.md `
              --verify-tag
          }

      # Mirror the same Release into this repo once the release repo has it.
      # Same tag, same assets, same notes. A re-run replaces the assets.
      - name: Sync GitHub Release to main repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $assets = Get-ChildItem dist | ForEach-Object FullName
          Write-Host "Syncing release $tag to $repo ($($assets.Count) assets)"

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $repo." }
            gh release edit $tag --repo $repo --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release notes in $repo." }
          } else {
            gh release create $tag $assets `
              --repo $repo `
              --title "MediaFlyouts $tag" `
              --notes-file release-notes.md `
              --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag in $repo." }
          }
