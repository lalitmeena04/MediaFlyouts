name: Sync issues with release repo

on:
  issues:
    types:
      - opened
      - edited
      - deleted
      - closed
      - reopened
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned
      - locked
      - unlocked
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

env:
  RELEASE_REPO: MediaFlyouts-Releases

jobs:
  sync:
    runs-on: ubuntu-latest
    # 'from-public' marks issues mirrored from the public repo.
    # 'public' opts a private-origin issue in to be published there.
    if: >-
      contains(github.event.issue.labels.*.name, 'from-public') ||
      contains(github.event.issue.labels.*.name, 'public')
    steps:
      # The sync script lives in the public repo. One copy for both sides.
      - name: Checkout sync script
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/${{ env.RELEASE_REPO }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      # Same App as release.yml. It must have Issues read/write on both repos.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},${{ env.RELEASE_REPO }}

      - name: Sync
        uses: actions/github-script@v7
        env:
          SIDE: private
          PEER_REPO: ${{ env.RELEASE_REPO }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sync = require('./.github/scripts/sync-issue.js');
            await sync({ github, context, core });
